name: Windows Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  APP_VERSION: "0.1.${{ github.run_number }}"

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore CxShell.Tests/CxShell.Tests.csproj

      - name: Test
        run: dotnet test CxShell.Tests/CxShell.Tests.csproj --no-restore --configuration Release

  package:
    name: Package Windows x64
    runs-on: windows-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish self-contained app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish CxShell.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o artifacts\publish\win-x64 `
            /p:Version=${{ env.APP_VERSION }} `
            /p:AssemblyVersion=${{ env.APP_VERSION }} `
            /p:FileVersion=${{ env.APP_VERSION }} `
            /p:InformationalVersion=${{ env.APP_VERSION }} `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true `
            /p:DebugType=none `
            /p:DebugSymbols=false

      - name: Create self-contained portable executable
        shell: pwsh
        run: Copy-Item artifacts\publish\win-x64\CxShell.exe artifacts\CxShell-Portable.exe

      - name: Publish framework-dependent portable executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish CxShell.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o artifacts\publish\win-x64-framework-dependent `
            /p:Version=${{ env.APP_VERSION }} `
            /p:PublishSingleFile=true `
            /p:EnableCompressionInSingleFile=true `
            /p:DebugType=none `
            /p:DebugSymbols=false
          Copy-Item artifacts\publish\win-x64-framework-dependent\CxShell.exe artifacts\CxShell-Portable-FrameworkDependent.exe

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk

      - name: Build Velopack package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          vpk pack `
            --packId CxShell `
            --packVersion $env:APP_VERSION `
            --packDir artifacts\publish\win-x64 `
            --mainExe CxShell.exe `
            --outputDir artifacts\release `
            --packTitle CxShell `
            --packAuthors luzwales

          $setup = Get-ChildItem artifacts\release -Filter "*Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Velopack did not produce a setup executable." }
          Copy-Item $setup.FullName artifacts\CxShell-Setup.exe

          if (-not (Test-Path artifacts\release\RELEASES)) {
            throw "Velopack did not produce the RELEASES feed file."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: CxShell v${{ env.APP_VERSION }}
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/CxShell-Setup.exe
            artifacts/CxShell-Portable.exe
            artifacts/CxShell-Portable-FrameworkDependent.exe
            artifacts/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}